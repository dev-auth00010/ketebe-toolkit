<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ketebe Downloader</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 310px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px;
  color: #1a1a1a;
  background: #faf9f7;
}

.header {
  background: #1a1a1a;
  color: #fff;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .02em;
}

.body { padding: 16px 14px; }

/* idle */
.message {
  color: #aaa;
  line-height: 1.7;
  text-align: center;
  padding: 24px 0;
  font-size: 12px;
}

/* ready */
.artwork-label {
  font-size: 11px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 4px;
}
.dims {
  font-size: 13px;
  color: #444;
  margin-bottom: 16px;
  min-height: 18px;
}

.btn {
  width: 100%;
  padding: 10px;
  background: #1a1a1a;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background .12s;
}
.btn:hover:not(:disabled) { background: #333; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* progress */
.status {
  font-size: 12px;
  color: #666;
  margin-bottom: 10px;
}
.progress-bar {
  height: 5px;
  background: #e8e4df;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 6px;
}
.progress-fill {
  height: 100%;
  background: #8b6f47;
  border-radius: 3px;
  width: 0;
  transition: width .15s;
}
.progress-label {
  font-size: 11px;
  color: #bbb;
}

/* done */
.success { color: #27ae60; font-weight: 600; margin-bottom: 4px; }

/* error */
.error { color: #c0392b; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div class="header">Ketebe Artwork Downloader</div>
<div class="body">

  <div id="view-idle">
    <div class="message">Open a ketebe.org artwork page,<br>then click this icon.</div>
  </div>

  <div id="view-ready" hidden>
    <div class="artwork-label" id="artworkLabel"></div>
    <div class="dims" id="dimsLabel">Looking up image…</div>
    <button class="btn" id="downloadBtn" disabled>⬇ Download Full Image</button>
  </div>

  <div id="view-progress" hidden>
    <div class="status" id="statusText">Starting…</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <div id="view-done" hidden>
    <div class="success">✓ Download started</div>
    <div class="dims" id="savedLabel"></div>
  </div>

  <div id="view-error" hidden>
    <div class="error" id="errorText"></div>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
